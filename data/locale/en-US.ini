Color.Offset.Group="Offset"
Color.Offset="Offset (added to R, G and B)"
Color.Offset.Info="Adds a fixed linear value in nits to every pixel, after the rest of the grade and before Grade Mix and the soft clips, so it lands on the scope exactly as set. Unlike exposure it moves black. Black lifted to: 0.001 nits = HLG 0.55%, 0.005 = 1.1%, 0.01 = 1.4%, 0.05 = 2.8%, 0.1 = 3.7%, 0.5 = 7.3%, 1 nit = 9.7%. Negative values pull pixels below black; they are kept (not clamped) and read 0% after OBS encodes. Type a value for fine steps."
Color.Clip="Soft clip"
Color.Clip.Info="Both clips act on linear luminance after Grade Mix (they still work at Grade Mix 0) with one gain for R, G and B. Low: black-preserving toe below the knee (does not lift black). High: identity up to the knee, then a smooth shoulder that approaches the peak and never reaches it (1000-nit peak, 750-nit knee: 1000 in -> 875 out, 2000 -> 958). Knee = peak gives a hard cap."
Color.Clip.Conflict="CONFLICT: low knee is above the high knee. Keeping the previous curves until fixed."
