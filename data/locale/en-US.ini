Pattern.Name="HDR Toolkit: Test Pattern (developer)"
Pattern.Info="Exact linear HDR values (GS_CS_709_EXTENDED), no video decode. Rows top to bottom: neutral patches 0 / 0.01 / 0.1 / 1 / 18 / 100 / 203 / 300 / 750 / 1000 / 2000 / 4000 / 10000 nits; log ramp 0.01-10000 nits; 1/6-stop highlight steps from 150 nits; OBS-HLG levels 0-100% then 105% and 109%; Rec.709 primaries/secondaries and Rec.2020 primaries at 100 nits; alpha 0 / 0.0001 / 0.1 / 0.5 / 1 at 1000-nit warm white and 4000-nit white."
