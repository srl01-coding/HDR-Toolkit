Sdr.Peak.Help="Brightest HDR level the conversion keeps (Lhdr in BT.2446). The standard value is the content's peak, usually 1000 nits. Lower values brighten the SDR picture and clip everything above them: at 400 nits, HDR reference white (203 nits, 75% HLG) lands at about 87% SDR instead of 69%."
