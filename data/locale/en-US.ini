Sdr.Name="SDR Conversion"
Sdr.Info="Shows the SDR version of an HDR picture, to check before broadcast what SDR viewers will see. Everything after this filter, including the stream, gets the SDR version while it is enabled: use it on a nested scene shown in a projector, or enable it only while checking. On an SDR canvas it is a proper HDR to SDR conversion for an HLG camera (instead of OBS's own tone map)."
